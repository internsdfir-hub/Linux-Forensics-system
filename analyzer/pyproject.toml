[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lfa"
version = "0.1.0"
description = "Linux Forensic Analyzer - offline two-stage forensic log processing tool (examiner side)"
requires-python = ">=3.11"
dependencies = [
    "PyYAML>=6",
    "Jinja2>=3",
    "tzdata>=2024.1; platform_system == 'Windows'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
include = ["lfa*"]
